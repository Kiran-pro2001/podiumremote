<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1f2723" />
      <stop offset="100%" stop-color="#121514" />
    </radialGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8eae9d" />
      <stop offset="100%" stop-color="#7a9a8b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Subtle glow halo -->
  <circle cx="950" cy="280" r="180" fill="#7a9a8b" opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="220" r="90" fill="#d9777f" opacity="0.08" filter="url(#glow)" />

  <!-- Top Brand Tag -->
  <g transform="translate(100, 100)">
    <rect width="180" height="36" rx="18" fill="#1a1f1d" stroke="#262f2b" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#7a9a8b" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#8eae9d" letter-spacing="1">PODIUM REMOTE</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Your Phone Camera.
  </text>
  <text x="100" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="url(#sageGrad)" letter-spacing="-1.5">
    Controlled From Your Laptop.
  </text>

  <!-- Value Statement -->
  <text x="100" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9da8a3" width="600">
    Record remotely over your phone's personal hotspot.
  </text>
  <text x="100" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9da8a3">
    Zero cloud • Zero internet required • Uncompressed 4K local storage.
  </text>

  <!-- Key Badges -->
  <g transform="translate(100, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="48" rx="10" fill="#1a1f1d" stroke="#262f2b" />
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#c5a582">⚡ 100% Offline-First</text>

    <!-- Badge 2 -->
    <rect x="235" y="0" width="230" height="48" rx="10" fill="#1a1f1d" stroke="#262f2b" />
    <text x="255" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#8eae9d">🔴 Instant Tally Feedback</text>

    <!-- Badge 3 -->
    <rect x="480" y="0" width="210" height="48" rx="10" fill="#1a1f1d" stroke="#262f2b" />
    <text x="500" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff">📱 Android + Browser</text>
  </g>

  <!-- Hardware Mockup Diagram on the Right -->
  <g transform="translate(820, 160)">
    <!-- Tripod / Stand Frame -->
    <rect x="50" y="40" width="180" height="280" rx="20" fill="#161b19" stroke="#7a9a8b" stroke-width="2" />
    <!-- Screen representation -->
    <rect x="65" y="70" width="150" height="210" rx="12" fill="#111413" />
    <!-- Recording Dot -->
    <circle cx="140" cy="150" r="28" fill="#d9777f" opacity="0.9" />
    <circle cx="140" cy="150" r="38" stroke="#d9777f" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    <text x="140" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">REC 00:14:32</text>

    <!-- Signal bridge to laptop -->
    <path d="M-60 180 Q-10 140 40 180" stroke="#7a9a8b" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity="0.8" />
    <text x="-10" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#c5a582" text-anchor="middle">Local WebSocket</text>

    <!-- Mini Laptop Mock -->
    <rect x="-140" y="190" width="120" height="75" rx="6" fill="#1a1f1d" stroke="#262f2b" stroke-width="1.5" />
    <rect x="-132" y="198" width="104" height="50" rx="3" fill="#121514" />
    <circle cx="-110" cy="223" r="6" fill="#d9777f" />
    <rect x="-98" y="220" width="55" height="6" rx="3" fill="#7a9a8b" />
    <!-- Base -->
    <path d="M-155 265 L-5 265 L-20 273 L-140 273 Z" fill="#262f2b" />
  </g>

  <!-- Founder Signature Footer -->
  <text x="100" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#6d7873">
    Crafted by Kiran Kumar • 365 Days Product Experiment • Bengaluru, Bharat 🇮🇳
  </text>
</svg>
